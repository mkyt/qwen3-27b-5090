# Builds the Windows package (scripts/windows/package.ps1): qwen3-27b-5090-<version>-windows-x64.zip (v0.3.0 on a tag,
# v0.3.0-3-g6767c0c on main after it), a workflow artifact from main when the code in it changes, and an asset of the
# GitHub Release of a v* tag (with its SHA-256; a tagged commit's main push skips the build). The runner has no GPU: the engine compiles, the GPU tests are run
# before tagging.
name: windows

on:
  push:
    branches: [main]
    tags: ["v*"]
    paths:
      - engine/**
      - frontend/**
      - reference/qwen27b/**
      - bench/draft-vocab/**
      - scripts/download_weights.py
      - scripts/windows/**
      - windows/tray/**
      - .github/workflows/windows.yml
  workflow_dispatch:

permissions:
  contents: write  # (the Release of a tag)
  id-token: write  # (the attestations: a Sigstore signing certificate from the workflow's OIDC token)
  attestations: write
  artifact-metadata: write

env:
  CUDA_VERSION: 13.3.1
  CUDA_DIR: C:\Program Files\NVIDIA GPU Computing Toolkit\CUDA\v13.3
  # MSVC toolset for nvcc: CUDA 13.3's cudafe++ crashes (0xC0000005) on MSVC 14.52 (the runner image of 2026-11-16,
  # which keeps 14.29, 14.44 and 14.52), even on CMake's compiler-id test. 14.44 is Visual Studio 2022's last toolset.
  # Used when the runner has it; otherwise the default toolset.
  MSVC_TOOLSET: "14.44"

jobs:
  # A release pushes main and its v* tag together: the tag's run builds that commit (and also tags it latest), so
  # the run of the main push skips it instead of building the same thing twice.
  tagged:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    outputs:
      found: ${{ steps.check.outputs.found }}
    steps:
      - id: check
        run: |
          if git ls-remote --tags "https://github.com/${{ github.repository }}" "refs/tags/v*" | grep -q "^${GITHUB_SHA}"; then
            echo "found=true" >> "$GITHUB_OUTPUT"
            echo "::notice::${GITHUB_SHA} has a v* tag: its tag run builds it"
          fi
  package:
    needs: tagged
    if: ${{ !cancelled() && needs.tagged.outputs.found != 'true' }}
    runs-on: windows-2025
    steps:
      # (all the history and tags: git describe names the version)
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Version
        shell: pwsh
        run: |
          $v = git describe --tags --match "v*" --always
          if ($LASTEXITCODE -or -not $v) { throw "git describe failed" }
          "VERSION=$v" >> $env:GITHUB_ENV
          "PKG=qwen3-27b-5090-$v-windows-x64" >> $env:GITHUB_ENV
      # (pip downloads the package's wheels; it does not need to be the package's Python)
      - uses: actions/setup-python@v7
        with:
          python-version: "3.14"
      # The CUDA toolkit's compiler parts only (the network installer, 10 MB, fetches them), cached between runs.
      - id: cuda-cache
        uses: actions/cache@v6
        with:
          path: ${{ env.CUDA_DIR }}
          key: cuda-${{ env.CUDA_VERSION }}-nvcc-nvvm-cudart-crt-thrust
      - name: Install the CUDA compiler
        if: steps.cuda-cache.outputs.cache-hit != 'true'
        shell: pwsh
        run: |
          $exe = "$env:RUNNER_TEMP\cuda_network.exe"
          Invoke-WebRequest "https://developer.download.nvidia.com/compute/cuda/$env:CUDA_VERSION/network_installers/cuda_${env:CUDA_VERSION}_windows_network.exe" -OutFile $exe
          $v = ($env:CUDA_VERSION -split "\.")[0..1] -join "."
          $p = Start-Process $exe -Wait -PassThru -ArgumentList "-s", "nvcc_$v", "nvvm_$v", "cudart_$v", "crt_$v", "thrust_$v"
          if ($p.ExitCode) { throw "CUDA installer exit code $($p.ExitCode)" }
          & "$env:CUDA_DIR\bin\nvcc.exe" --version
      # MSVC from the runner's Visual Studio (vcvars64.bat, toolset MSVC_TOOLSET), CMake and Ninja from its PATH.
      - name: Build the package
        shell: cmd
        run: |
          for /f "usebackq delims=" %%i in (`"%ProgramFiles(x86)%\Microsoft Visual Studio\Installer\vswhere.exe" -latest -products * -requires Microsoft.VisualStudio.Component.VC.Tools.x86.x64 -property installationPath`) do set "VS=%%i"
          echo MSVC toolsets: & dir /b "%VS%\VC\Tools\MSVC"
          set "VCVER="
          if exist "%VS%\VC\Tools\MSVC\%MSVC_TOOLSET%.*" set "VCVER=-vcvars_ver=%MSVC_TOOLSET%"
          if not defined VCVER echo MSVC %MSVC_TOOLSET% not installed, using the default toolset
          call "%VS%\VC\Auxiliary\Build\vcvars64.bat" %VCVER% || exit /b 1
          set "CUDA_PATH=%CUDA_DIR%"
          set "CUDACXX=%CUDA_DIR%\bin\nvcc.exe"
          set "PATH=%CUDA_DIR%\bin;%PATH%"
          powershell -NoProfile -ExecutionPolicy Bypass -File scripts\windows\package.ps1 -Python python -Version %VERSION% || exit /b 1
      # The package loads: q27.dll through ctypes in its own Python, with the C API all there (no GPU needed).
      - name: Smoke test
        shell: pwsh
        run: |
          $py = "dist\qwen3-27b-5090-windows-x64\python\python.exe"
          $app = "dist\qwen3-27b-5090-windows-x64\app"
          & $py -c "import sys; sys.path.insert(0, r'$app\engine\python'); import q27lib; l = q27lib.lib(); assert l.q27t_sf_bytes(2048, 320) == 655360; import PIL, tokenizers, jinja2; print('ok', sys.version)"
          if ($LASTEXITCODE) { throw "smoke test failed" }
          $tray = Start-Process "dist\qwen3-27b-5090-windows-x64\qwen3-27b-tray.exe" -ArgumentList "--check" -Wait -PassThru
          if ($tray.ExitCode) { throw "the tray app does not find the package ($($tray.ExitCode))" }
          $errs = $null
          $null = [System.Management.Automation.Language.Parser]::ParseFile((Resolve-Path "$app\scripts\update.ps1"), [ref]$null, [ref]$errs)
          if ($errs) { throw "update.ps1: $errs" }
          if ((Get-Content "$app\VERSION") -ne $env:VERSION) { throw "app\VERSION is not $env:VERSION" }
          (Get-FileHash -Algorithm SHA256 "dist\$env:PKG.zip").Hash.ToLower() + "  $env:PKG.zip" | Set-Content -Encoding ascii "dist\$env:PKG.zip.sha256"
      # Build provenance (SLSA, signed through Sigstore) for the zip and the two binaries built here, so a download can
      # be checked against this workflow and commit: gh attestation verify <file> --repo mkyt/qwen3-27b-5090
      - uses: actions/attest@v4
        with:
          subject-path: |
            dist/${{ env.PKG }}.zip
            dist/qwen3-27b-5090-windows-x64/qwen3-27b-tray.exe
            dist/qwen3-27b-5090-windows-x64/app/engine/build/q27.dll
      - uses: actions/upload-artifact@v7
        with:
          name: ${{ env.PKG }}
          path: |
            dist/${{ env.PKG }}.zip
            dist/${{ env.PKG }}.zip.sha256
          retention-days: 30
      - name: Release asset
        if: startsWith(github.ref, 'refs/tags/v')
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release view $env:GITHUB_REF_NAME 2>$null
          if ($LASTEXITCODE) { gh release create $env:GITHUB_REF_NAME --verify-tag --generate-notes }
          gh release upload $env:GITHUB_REF_NAME "dist\$env:PKG.zip" "dist\$env:PKG.zip.sha256" --clobber
