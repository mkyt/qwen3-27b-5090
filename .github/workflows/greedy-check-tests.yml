name: Greedy diagnostic regression tests

on:
  pull_request:
    paths: ["scripts/bench_spec.py", "scripts/ab_decode.py", "frontend/tests/test_bench_spec.py", ".github/workflows/greedy-check-tests.yml"]
  push:
    paths: ["scripts/bench_spec.py", "scripts/ab_decode.py", "frontend/tests/test_bench_spec.py", ".github/workflows/greedy-check-tests.yml"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  diagnostic:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - run: python -m pip install pytest
      - run: python -m pytest -q frontend/tests/test_bench_spec.py
