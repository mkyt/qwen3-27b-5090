name: CPU regression tests

on:
  pull_request:
    paths:
      - "frontend/**"
      - "engine/**"
      - "reference/qwen27b/**"
      - "scripts/**"
      - "compose.yaml"
      - ".github/workflows/cpu-tests.yml"
  push:
    paths:
      - "frontend/**"
      - "engine/**"
      - "reference/qwen27b/**"
      - "scripts/**"
      - "compose.yaml"
      - ".github/workflows/cpu-tests.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  cpu:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - run: python -m pip install --no-deps -r frontend/requirements.txt
      - run: python -m pip install pytest numpy==2.5.3
      - run: python -m pytest -q frontend/tests engine/tests_cpu
        env:
          Q27_TEST_SANITIZERS: "1"
          ASAN_OPTIONS: detect_leaks=0
  updater:
    runs-on: windows-2025
    steps:
      - uses: actions/checkout@v7
      - name: Check updater under Windows PowerShell
        shell: powershell
        run: ./scripts/windows/tests/update.test.ps1
