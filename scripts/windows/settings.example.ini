; Settings of the Windows package. Copy this file to settings.ini, next to qwen3-27b-tray.exe and start.cmd, and remove
; the ";" of what you change. They apply when the server starts. An update does not touch settings.ini.
; All the variables of docs/configuration.md work here. settings.ini comes before the environment.
; Settings in the tray app's menu edits this file too, keeping these comments.

[env]
; The Hugging Face cache with the weights (23 GB). Relative to this folder; another path keeps them out of it, e.g. to
; share an existing cache (%USERPROFILE%\.cache\huggingface), written in full.
;HF_HOME=huggingface

; The address of the API and the web UI (0.0.0.0: the network, which Windows Firewall asks about; anyone there can then
; change the engine's settings, as /admin has no authentication).
;HOST=127.0.0.1
;PORT=8000

; The tray app: seconds without a request before the engine frees its VRAM (0: never), and 1 to load it at the start
; instead of at the first request. start.cmd: never, and it loads at the start.
;ENGINE_IDLE_UNLOAD_S=1800
;ENGINE_AUTOSTART=0
